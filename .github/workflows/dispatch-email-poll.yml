name: Poll inbound email

on:
  schedule:
    # Кожні 5 хвилин — забір вхідних листів зі скриньки (IMAP) у CRM Inbox.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: dispatch-email-poll
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call email-poll endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ] || [ -z "${APP_URL:-}" ]; then
            echo "::warning::APP_URL var or CRON_SECRET secret not configured — skipping."
            exit 0
          fi
          RESPONSE=$(curl -sS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -w "\n---HTTP %{http_code}---" \
            "${APP_URL%/}/api/cron/email-poll")
          echo "$RESPONSE"
          HTTP_CODE=$(echo "$RESPONSE" | grep -o 'HTTP [0-9]*' | awk '{print $2}')
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::email-poll returned HTTP $HTTP_CODE"
            exit 1
          fi
